name: Build VMC Bridge

on:
  workflow_dispatch:
  push:
    tags: ['bridge-v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            targets: native darwin-x64
          - os: windows-latest
            targets: native
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build
        shell: bash
        run: |
          for t in ${{ matrix.targets }}; do
            if [ "$t" = native ]; then node scripts/buildBridge.mjs
            else BRIDGE_TARGET="$t" node scripts/buildBridge.mjs
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-${{ matrix.os }}
          path: dist-bridge/VMC-Bridge-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: zips
      - name: Publish the downloadable bridge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="bridge-v0.1.1"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "VMC Bridge 0.1.1" --notes "Open VMC Bridge. It receives the phone's tracking and the studio page connects to it. https://ccavins.github.io/VMC_app/"
          gh release upload "$tag" zips/*/*.zip --clobber
